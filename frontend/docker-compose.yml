services:
  basketball-timer:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: basketball-timer-app
    ports:
      - "3002:80"
    restart: unless-stopped
    networks:
      - basketball-timer-network

networks:
  basketball-timer-network:
    driver: bridge
