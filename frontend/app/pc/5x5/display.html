<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5x5 Basketball Stadium LED Scoreboard Display</title>
    <!-- Crisp, high-contrast digital fonts for 24"/27" monitors -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800;900&family=Orbitron:wght@700;800;900&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #050608;
            --frame-bg: #0e1014;
            --frame-border: #1f242d;
            --panel-bg: #090b0f;

            --color-red: #ff2222;
            --color-red-glow: rgba(255, 34, 34, 0.45);
            --color-amber: #ffaa00;
            --color-amber-glow: rgba(255, 170, 0, 0.45);
            --color-green: #00ff55;
            --color-green-glow: rgba(0, 255, 85, 0.45);

            --color-unlit: #181b22;
            --color-unlit-border: #242934;

            --font-digits: 'Chakra Petch', 'Orbitron', 'Inter', sans-serif;
            --font-labels: 'Inter', 'Chakra Petch', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-canvas);
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-labels);
            overflow: hidden;
            padding: 0.5vh 0.5vw;
        }

        /* Full Screen Scoreboard Casing optimized for 24" & 27" monitors */
        .scoreboard-casing {
            background: linear-gradient(145deg, #12151b, #07090c);
            border: 4px solid var(--frame-border);
            border-radius: 20px;
            box-shadow: 
                0 0 0 2px #020304,
                0 20px 50px rgba(0, 0, 0, 0.95),
                inset 0 2px 4px rgba(255, 255, 255, 0.05);
            width: 98vw;
            height: 97vh;
            padding: 1.5vh 1.5vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* --- HEADER ROW: TEAMS & PERIOD --- */
        .row-header {
            display: grid;
            grid-template-columns: 1.25fr 0.75fr 1.25fr;
            align-items: center;
            text-align: center;
            height: 14vh;
        }

        .team-label {
            font-size: clamp(2.2rem, 4.5vh, 5.5rem);
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        .team-label.home { text-align: left; padding-left: 0.5vw; }
        .team-label.guest { text-align: right; padding-right: 0.5vw; }

        .header-center {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--panel-bg);
            border: 2px solid var(--frame-border);
            border-radius: 18px;
            padding: 1.2vh 2.6vw;
            margin: 0 auto;
            width: max-content;
            min-width: 65%;
            height: 82%;
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.85);
        }

        .header-period-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
        }

        .possession-arrow {
            font-size: clamp(2.4rem, 5.5vh, 5.5rem);
            font-family: var(--font-digits);
            color: var(--color-unlit);
            transition: all 0.2s ease;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        .possession-arrow.active {
            color: var(--color-red);
            text-shadow: 0 0 12px var(--color-red-glow);
        }

        .period-digit {
            font-family: var(--font-digits);
            font-size: clamp(3.5rem, 8vh, 8rem);
            font-weight: 900;
            color: var(--color-amber);
            text-shadow: 0 0 15px var(--color-amber-glow);
            line-height: 1;
            min-width: 2.2rem;
            text-align: center;
        }

        /* --- MAIN ROW: TEAM SCORES & CENTER CLOCKS (GAME CLOCK + SHOT CLOCK) --- */
        .row-main {
            display: grid;
            grid-template-columns: 1.25fr 0.75fr 1.25fr;
            gap: 1.5vw;
            align-items: center;
            height: 62vh;
            margin: 0.5vh 0;
        }

        /* Compact Team Score Boxes */
        .score-panel {
            background: var(--panel-bg);
            border: 2px solid var(--frame-border);
            border-radius: 18px;
            padding: 1vh 1vw;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
        }

        .digit-score {
            font-family: var(--font-digits);
            font-size: clamp(9.7rem, 34vh, 19.3vw);
            font-weight: 900;
            line-height: 0.9;
            color: var(--color-amber);
            text-shadow: 0 0 20px var(--color-amber-glow);
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
        }

        /* CENTER CLOCKS COLUMN - 2 DISTINCT STACKED BOXES */
        .clocks-column {
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            height: 100%;
            width: 100%;
        }

        /* TOP BOX: GAME CLOCK BOX */
        .game-clock-box {
            background: var(--panel-bg);
            border: 2px solid var(--frame-border);
            border-radius: 18px;
            padding: 0.8vh 1vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 0.8; /* Smaller box */
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
        }

        .game-clock-digit {
            font-family: var(--font-digits);
            font-size: clamp(3.5rem, 12vh, 5.8vw);
            font-weight: 900;
            color: var(--color-green);
            text-shadow: 0 0 18px var(--color-green-glow);
            letter-spacing: 2px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* BOTTOM BOX: SHOT CLOCK BOX (BIGGER) */
        .shot-clock-box {
            background: var(--panel-bg);
            border: 2px solid var(--frame-border);
            border-radius: 18px;
            padding: 1vh 1vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1.5; /* Bigger box than game clock */
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .shot-clock-digit {
            font-family: var(--font-digits);
            font-size: clamp(7.5rem, 28vh, 14vw);
            font-weight: 900;
            line-height: 0.95;
            color: var(--color-red);
            text-shadow: 0 0 30px var(--color-red-glow);
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shot-clock-container-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        .shot-possession-arrow {
            font-family: var(--font-digits);
            font-size: clamp(2.4rem, 7vh, 5.5rem);
            color: var(--color-unlit);
            line-height: 1;
            transition: all 0.2s ease;
            user-select: none;
            position: absolute;
            z-index: 2;
        }

        .shot-possession-arrow.left {
            left: 0.8vw;
        }

        .shot-possession-arrow.right {
            right: 0.8vw;
        }

        .shot-possession-arrow.active {
            color: var(--color-amber);
            text-shadow: 0 0 22px var(--color-amber-glow), 0 0 10px rgba(255, 170, 0, 0.9);
            transform: scale(1.12);
        }

        /* FULL RED ALERT FLASH WHEN SHOT CLOCK REACHES 0 */
        .shot-clock-box.expired {
            background: #cc0000 !important;
            border-color: #ff3333 !important;
            box-shadow: 0 0 70px rgba(255, 0, 0, 0.95), inset 0 0 40px rgba(0, 0, 0, 0.4) !important;
            animation: pulse-red-alert 0.5s infinite alternate;
        }

        @keyframes pulse-red-alert {
            from {
                background-color: #b30000;
                box-shadow: 0 0 45px rgba(179, 0, 0, 0.8);
            }
            to {
                background-color: #ff1a1a;
                box-shadow: 0 0 90px rgba(255, 26, 26, 1);
            }
        }

        .shot-clock-box.expired .shot-clock-label {
            color: #ffffff !important;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
        }

        .shot-clock-box.expired .shot-clock-digit {
            color: #ffffff !important;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px rgba(0, 0, 0, 0.6) !important;
        }

        /* --- LOWER ROW: FOULS & TIMEOUTS LEFT (T.O.L) --- */
        .row-lower {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5vw;
            height: 14vh;
        }

        .stats-panel {
            background: var(--panel-bg);
            border: 2px solid var(--frame-border);
            border-radius: 14px;
            padding: 1vh 1.5vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.85);
            transition: all 0.3s ease;
        }

        .stats-panel.bonus {
            background: #cc0033 !important;
            border-color: #ff3366 !important;
            box-shadow: 0 0 35px rgba(255, 0, 68, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.3) !important;
            animation: pulse-panel-neon 1s infinite alternate ease-in-out;
        }

        @keyframes pulse-panel-neon {
            from {
                background-color: #b3002d;
                box-shadow: 0 0 25px rgba(230, 0, 57, 0.85);
            }
            to {
                background-color: #ff0044;
                box-shadow: 0 0 45px rgba(255, 0, 68, 1);
            }
        }

        .stats-panel.bonus .stat-title {
            color: #ffffff !important;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
        }

        .stats-panel.bonus .foul-digit {
            color: #ffffff !important;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.95) !important;
        }

        .stats-panel.bonus .tol-square.active {
            background-color: #ffffff !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.95), inset 0 0 4px rgba(255, 255, 255, 0.5) !important;
        }

        .stats-panel.bonus .tol-square:not(.active) {
            background-color: rgba(0, 0, 0, 0.45) !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
            box-shadow: none !important;
        }

        .foul-group {
            display: flex;
            align-items: center;
            gap: 2.2vw;
            white-space: nowrap;
        }

        .stat-title {
            font-size: clamp(1.2rem, 2.8vh, 3.2rem);
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .foul-title {
            font-size: clamp(1.4rem, 3.4vh, 3.8rem);
            letter-spacing: 3px;
        }

        .foul-digit {
            font-family: var(--font-digits);
            font-size: clamp(3.2rem, 7.5vh, 8rem);
            font-weight: 900;
            color: var(--color-amber);
            text-shadow: 0 0 15px var(--color-amber-glow);
            line-height: 1;
            min-width: 3vw;
            text-align: center;
        }

        /* T.O.L Indicators */
        .tol-indicators {
            display: flex;
            gap: 0.6vw;
            align-items: center;
        }

        .tol-square {
            width: clamp(20px, 3vh, 36px);
            height: clamp(20px, 3vh, 36px);
            background-color: #141720;
            border: 2px solid #283144;
            border-radius: 6px;
            transition: all 0.25s ease;
        }

        .tol-square.active {
            background-color: var(--color-red);
            border-color: #ff6666;
            box-shadow: 0 0 14px var(--color-red-glow), inset 0 0 4px rgba(255, 255, 255, 0.4);
        }

        /* Subtle Audio Status Badge */
        .audio-status-badge {
            position: fixed;
            bottom: 12px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(14, 16, 20, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .audio-status-badge.prompt {
            border-color: #eab308;
            color: #facc15;
            animation: pulse-audio-badge 2s infinite ease-in-out;
        }

        .audio-status-badge.unlocked {
            border-color: rgba(34, 197, 94, 0.4);
            color: #4ade80;
            opacity: 0.35;
        }

        .audio-status-badge.unlocked:hover {
            opacity: 1;
        }

        /* Floating Fullscreen Button for Display */
        .btn-fullscreen {
            position: fixed;
            top: 14px;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(14, 16, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #94a3b8;
            cursor: pointer;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }

        .btn-fullscreen:hover {
            background: rgba(30, 41, 59, 0.95);
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            transform: scale(1.04);
        }

        /* In fullscreen mode, keep button discreet unless hovered */
        :fullscreen .btn-fullscreen {
            opacity: 0.25;
        }

        :fullscreen .btn-fullscreen:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Fullscreen Button for Stadium Display -->
    <button id="displayFullscreenBtn" class="btn-fullscreen" onclick="toggleFullscreen()" title="Toggle Fullscreen (or Double-Click background)">
        <span id="displayFsIcon">⛶</span>
        <span id="displayFsText">FULLSCREEN</span>
    </button>

    <div class="scoreboard-casing">

        <!-- HEADER ROW: TEAMS & PERIOD -->
        <div class="row-header">
            <div class="team-label home">HOME</div>
            
            <div class="header-center">
                <div class="header-period-group">
                    <span class="possession-arrow" id="homeArrow">&#9664;</span>
                    <div class="period-digit" id="periodDisplay">1</div>
                    <span class="possession-arrow" id="guestArrow">&#9654;</span>
                </div>
            </div>

            <div class="team-label guest">GUEST</div>
        </div>

        <!-- MAIN ROW: COMPACT HOME SCORE, CENTER CLOCKS (GAME CLOCK + SHOT CLOCK), COMPACT GUEST SCORE -->
        <div class="row-main">
            <!-- HOME SCORE -->
            <div class="score-panel">
                <div class="digit-score" id="homeScore">00</div>
            </div>

            <!-- CENTER CLOCKS COLUMN (2 SEPARATE BOXES V-STACKED) -->
            <div class="clocks-column">
                <!-- TOP BOX: GAME CLOCK BOX -->
                <div class="game-clock-box">
                    <div class="game-clock-digit" id="gameClock">10:00</div>
                </div>

                <!-- BOTTOM BOX: SHOT CLOCK BOX (SLIGHTLY BIGGER) -->
                <div class="shot-clock-box" id="shotClockBox">
                    <div class="shot-clock-container-row">
                        <span class="shot-possession-arrow left" id="leftShotPossArrow">&#9664;</span>
                        <div class="shot-clock-digit" id="shotClock">24</div>
                        <span class="shot-possession-arrow right" id="rightShotPossArrow">&#9654;</span>
                    </div>
                </div>
            </div>

            <!-- GUEST SCORE -->
            <div class="score-panel">
                <div class="digit-score" id="guestScore">00</div>
            </div>
        </div>

        <!-- LOWER ROW: FOULS & TIMEOUTS LEFT (T.O.L) -->
        <div class="row-lower">
            <!-- HOME FOULS & TOL PANEL -->
            <div class="stats-panel" id="homeStatsPanel">
                <div class="stat-group foul-group">
                    <span class="stat-title foul-title">FOULS</span>
                    <span class="foul-digit" id="homeFouls">0</span>
                </div>
                <div class="stat-group">
                    <span class="stat-title" style="font-size: clamp(0.9rem, 2vh, 2.2rem); color: #828a9a;">T.O.L</span>
                    <div class="tol-indicators">
                        <div class="tol-square active" id="homeTol1"></div>
                        <div class="tol-square active" id="homeTol2"></div>
                        <div class="tol-square" id="homeTol3"></div>
                    </div>
                </div>
            </div>

            <!-- GUEST / RIGHT STATS PANEL (SYMMETRICAL: T.O.L LEFT, FOULS RIGHT) -->
            <div class="stats-panel" id="guestStatsPanel">
                <div class="stat-group">
                    <span class="stat-title" style="font-size: clamp(0.9rem, 2vh, 2.2rem); color: #828a9a;">T.O.L</span>
                    <div class="tol-indicators">
                        <div class="tol-square active" id="guestTol1"></div>
                        <div class="tol-square active" id="guestTol2"></div>
                        <div class="tol-square" id="guestTol3"></div>
                    </div>
                </div>
                <div class="stat-group foul-group">
                    <span class="stat-title foul-title">FOULS</span>
                    <span class="foul-digit" id="guestFouls">0</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Audio Status Badge for Browser Autoplay Compliance -->
    <div id="audioStatusBadge" class="audio-status-badge prompt" onclick="unlockAudio(true)" title="Click anywhere to enable Stadium Horn">
        <span>🔊</span>
        <span id="audioText">Click to enable Horn Sound</span>
    </div>

    <!-- Receiver, Synchronizer & Audio Buzzer Script -->
    <script>
        const channel = new BroadcastChannel('basketball_scoreboard');

        // Web Audio API Stadium Horn Buzzer Sound (Plays on both screens)
        let audioCtx = null;
        let lastBuzzerPlayTime = 0;
        let audioUnlocked = false;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function updateAudioBadge(isReady) {
            const badge = document.getElementById('audioStatusBadge');
            const text = document.getElementById('audioText');
            if (!badge || !text) return;

            if (isReady) {
                audioUnlocked = true;
                badge.className = 'audio-status-badge unlocked';
                text.textContent = 'Horn Sound Ready';
            } else {
                badge.className = 'audio-status-badge prompt';
                text.textContent = 'Click to enable Horn Sound';
            }
        }

        function unlockAudio(playTest = false) {
            const ctx = getAudioContext();
            if (ctx) {
                ctx.resume().then(() => {
                    updateAudioBadge(true);
                    if (playTest) {
                        playBuzzerSound();
                    }
                }).catch(err => {
                    console.error("Audio resume error:", err);
                });
            }
        }

        ['click', 'keydown', 'mousedown', 'touchstart', 'pointerdown'].forEach(evt => {
            window.addEventListener(evt, () => unlockAudio(false), { passive: true });
        });

        // Powerful 5-harmonic sharp stadium arena horn buzzer
        function playBuzzerSound() {
            const nowTime = Date.now();
            if (nowTime - lastBuzzerPlayTime < 800) return;
            lastBuzzerPlayTime = nowTime;

            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                if (ctx.state === 'suspended') {
                    ctx.resume().catch(() => {});
                }

                const now = ctx.currentTime;
                const duration = 1.4;

                const masterGain = ctx.createGain();
                masterGain.gain.setValueAtTime(0.9, now);
                masterGain.gain.setValueAtTime(0.9, now + duration - 0.15);
                masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                const lowpass = ctx.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.setValueAtTime(4500, now);

                const highShelf = ctx.createBiquadFilter();
                highShelf.type = 'highshelf';
                highShelf.frequency.setValueAtTime(1800, now);
                highShelf.gain.setValueAtTime(8.0, now);

                const frequencies = [220, 330, 440, 660, 880];
                const gains = [0.4, 0.35, 0.3, 0.25, 0.2];

                frequencies.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now);
                    osc.detune.setValueAtTime((idx % 2 === 0 ? 1 : -1) * 12, now);

                    gain.gain.setValueAtTime(gains[idx], now);
                    osc.connect(gain);
                    gain.connect(lowpass);

                    osc.start(now);
                    osc.stop(now + duration);
                });

                lowpass.connect(highShelf);
                highShelf.connect(masterGain);
                masterGain.connect(ctx.destination);
                updateAudioBadge(true);
            } catch(e) {
                console.error("Display buzzer sound error:", e);
            }
        }

        function formatScore(val) {
            const num = Number(val) || 0;
            if (num < 100) {
                return String(num).padStart(2, '0');
            }
            return String(num);
        }

        function format2Digit(val) {
            const sec = Math.max(0, Math.ceil(val));
            return String(sec).padStart(2, '0');
        }

        function formatMMSS(totalSeconds) {
            const sec = Math.max(0, Math.ceil(totalSeconds));
            const minutes = Math.floor(sec / 60);
            const seconds = sec % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        let previousShotSeconds = null;
        let previousGameSeconds = null;

        function renderScoreboard(state) {
            if (!state) return;
            currentState = { ...currentState, ...state };

            const currentShotSec = state.shotSeconds ?? 24;
            const shotClockBox = document.getElementById('shotClockBox');

            // Trigger Full Red Box styling and buzzer sound when shot clock hits 0
            if (currentShotSec === 0) {
                shotClockBox.classList.add('expired');
                if (previousShotSeconds !== null && previousShotSeconds > 0) {
                    playBuzzerSound();
                }
            } else {
                shotClockBox.classList.remove('expired');
            }
            previousShotSeconds = currentShotSec;

            // Trigger buzzer sound when game clock hits 00:00
            const currentGameSec = state.gameSeconds ?? 600;
            if (currentGameSec === 0 && previousGameSeconds !== null && previousGameSeconds > 0) {
                playBuzzerSound();
            }
            previousGameSeconds = currentGameSec;

            const isSwapped = !!state.swapSides;

            // Team Labels in Header
            const homeLabel = document.querySelector('.team-label.home');
            const guestLabel = document.querySelector('.team-label.guest');
            if (homeLabel && guestLabel) {
                homeLabel.textContent = isSwapped ? "GUEST" : "HOME";
                guestLabel.textContent = isSwapped ? "HOME" : "GUEST";
            }

            // Scores
            const leftScore = isSwapped ? (state.guestScore ?? 0) : (state.homeScore ?? 0);
            const rightScore = isSwapped ? (state.homeScore ?? 0) : (state.guestScore ?? 0);
            document.getElementById('homeScore').textContent = formatScore(leftScore);
            document.getElementById('guestScore').textContent = formatScore(rightScore);

            // Period & Game Clock in Header
            document.getElementById('periodDisplay').textContent = state.period ?? "1";
            document.getElementById('gameClock').textContent = formatMMSS(state.gameSeconds ?? 600);

            // Possession Arrows (Header & Beside Shot Clock)
            const leftPossession = isSwapped ? (state.possession === 'guest') : (state.possession === 'home');
            const rightPossession = isSwapped ? (state.possession === 'home') : (state.possession === 'guest');

            const homeArrow = document.getElementById('homeArrow');
            const guestArrow = document.getElementById('guestArrow');
            const leftShotArrow = document.getElementById('leftShotPossArrow');
            const rightShotArrow = document.getElementById('rightShotPossArrow');

            if (leftPossession) {
                homeArrow.classList.add('active');
                guestArrow.classList.remove('active');
                if (leftShotArrow) leftShotArrow.classList.add('active');
                if (rightShotArrow) rightShotArrow.classList.remove('active');
            } else if (rightPossession) {
                guestArrow.classList.add('active');
                homeArrow.classList.remove('active');
                if (rightShotArrow) rightShotArrow.classList.add('active');
                if (leftShotArrow) leftShotArrow.classList.remove('active');
            } else {
                homeArrow.classList.remove('active');
                guestArrow.classList.remove('active');
                if (leftShotArrow) leftShotArrow.classList.remove('active');
                if (rightShotArrow) rightShotArrow.classList.remove('active');
            }

            // Shot Clock Digits
            document.getElementById('shotClock').textContent = format2Digit(currentShotSec);

            // Fouls
            const leftFouls = isSwapped ? (state.guestFouls ?? 0) : (state.homeFouls ?? 0);
            const rightFouls = isSwapped ? (state.homeFouls ?? 0) : (state.guestFouls ?? 0);
            document.getElementById('homeFouls').textContent = leftFouls;
            document.getElementById('guestFouls').textContent = rightFouls;

            // Highlight Whole Stats Panel (Fouls & T.O.L) with Neon Red when Team Fouls > 3
            const homeStatsPanel = document.getElementById('homeStatsPanel');
            const guestStatsPanel = document.getElementById('guestStatsPanel');
            if (homeStatsPanel) {
                if (leftFouls > 3) homeStatsPanel.classList.add('bonus');
                else homeStatsPanel.classList.remove('bonus');
            }
            if (guestStatsPanel) {
                if (rightFouls > 3) guestStatsPanel.classList.add('bonus');
                else guestStatsPanel.classList.remove('bonus');
            }

            // Timeouts Left (T.O.L)
            const leftTol = isSwapped ? (state.guestTOL ?? 3) : (state.homeTOL ?? 3);
            const rightTol = isSwapped ? (state.homeTOL ?? 3) : (state.guestTOL ?? 3);

            document.getElementById('homeTol1').className = leftTol >= 1 ? 'tol-square active' : 'tol-square';
            document.getElementById('homeTol2').className = leftTol >= 2 ? 'tol-square active' : 'tol-square';
            document.getElementById('homeTol3').className = leftTol >= 3 ? 'tol-square active' : 'tol-square';

            document.getElementById('guestTol1').className = rightTol >= 1 ? 'tol-square active' : 'tol-square';
            document.getElementById('guestTol2').className = rightTol >= 2 ? 'tol-square active' : 'tol-square';
            document.getElementById('guestTol3').className = rightTol >= 3 ? 'tol-square active' : 'tol-square';
        }

        let currentState = {
            homeScore: 0,
            guestScore: 0,
            period: "1",
            gameSeconds: 600,
            shotSeconds: 24,
            homeFouls: 0,
            guestFouls: 0,
            homeTOL: 2,
            guestTOL: 2,
            possession: 'none',
            isRunning: false,
            swapSides: false
        };

        channel.onmessage = function(event) {
            if (event.data && event.data.type === 'STATE_UPDATE') {
                renderScoreboard(event.data.state);
            } else if (event.data && event.data.type === 'PLAY_BUZZER') {
                playBuzzerSound();
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            getAudioContext();
            const saved = localStorage.getItem('basketball_scoreboard_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    currentState = { ...currentState, ...parsed };
                    renderScoreboard(currentState);
                } catch(e) {
                    console.error("Error reading saved state:", e);
                }
            }

            channel.postMessage({ type: 'REQUEST_STATE' });
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const isFs = !!document.fullscreenElement;
            const icon = document.getElementById('displayFsIcon');
            const text = document.getElementById('displayFsText');
            if (icon && text) {
                icon.textContent = isFs ? '🗗' : '⛶';
                text.textContent = isFs ? 'EXIT FULLSCREEN' : 'FULLSCREEN';
            }
        });

        // Double-click background to toggle fullscreen
        document.body.addEventListener('dblclick', (e) => {
            if (e.target.tagName !== 'BUTTON' && !e.target.closest('#audioStatusBadge') && !e.target.closest('#displayFullscreenBtn')) {
                toggleFullscreen();
            }
        });
    </script>
</body>
</html>
