<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Timer App</title>
    <link rel="stylesheet" href="style.css?v=20250809173000">
</head>
<body>
    <div class="rotate-screen-overlay">
        <div class="rotate-screen-content">
            <div class="rotate-device-icon"></div>
            <p class="rotate-text">Rotate Device to Landscape</p>
            <p class="rotate-subtext">This app is optimized for landscape scoreboard layout</p>
        </div>
    </div>
    <div class="container">
        <div class="timer-section">
            <div class="game-timer">
                <h2>Game Timer</h2>
                <div class="timer-display game-display" id="gameTimer">10:00</div>
                <button id="editGameBtn" class="edit-btn">EDIT</button>
            </div>
            
            <div class="shot-clock">
                <h2><img src="logo.jpg" class="logo" alt="Logo"><span>Shot Clock</span></h2>
                <div class="timer-display shot-display" id="shotClock">12.0</div>
                <button id="editShotBtn" class="edit-btn">EDIT</button>
            </div>
            
            <div class="controls">
                <button id="startStopBtn" class="control-btn start-stop">START</button>
                <button id="resetBtn" class="control-btn reset">RESET</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
