services:
  basketball-timer-dev:
    image: nginx:alpine
    container_name: basketball-timer-app-dev
    ports:
      - "3002:80"
    volumes:
      - type: bind
        source: ./app
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    restart: unless-stopped
    networks:
      - basketball-timer-network-dev

networks:
  basketball-timer-network-dev:
    driver: bridge
